# Deploy only: publishes @isoplan/protocol to npm when a release is published for a tag
# protocol-v<version>, and fails unless that version is the one in packages/protocol/package.json.
# It uses npm trusted publishing: npm trusts this repository, this file and the npm-publish
# environment (set on npmjs.com, in the package's settings), so there is no token secret, and the
# package gets a provenance statement. Approval can be required in the environment's settings.
name: Publish protocol

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'protocol-v')
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.1
      - name: Check the tag names the package's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./packages/protocol/package.json').version")
          if [ "$TAG" != "protocol-v$version" ]; then
            echo "The tag $TAG doesn't match packages/protocol/package.json, which is at $version; tag it protocol-v$version." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Publish, unless this version is on npm already
        working-directory: packages/protocol
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "@isoplan/protocol@$version" version 2>/dev/null)" ]; then
            echo "@isoplan/protocol@$version is on npm already; nothing to publish."
          else
            npm publish --provenance --access public
          fi
